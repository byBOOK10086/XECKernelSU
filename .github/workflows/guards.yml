name: guards

# Repository quality gates (see docs/QUALITY-GATES.md).
#
# One job, no matrix, no secrets: it runs the cheap structural checks that keep
# this tree from drifting back into the shape the previous one had (oversized
# files, locale sprawl, workflow sprawl, silently-succeeding shell).
#
# Deliberately separate from the build workflows so a red gate is unambiguous.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: python
        run: python3 --version

      - name: quality gates
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/check_quality.py

      - name: installer pure regression tests
        run: |
          rustc --edition 2024 --test userspace/ksud/tests/audit_pure.rs -o "$RUNNER_TEMP/audit-pure"
          "$RUNNER_TEMP/audit-pure"

      - name: shell syntax of the feature scripts
        # Two interpreters on purpose: the on-device scripts are `#!/system/bin/sh`
        # and must stay POSIX (Android runs them with mksh), while the offline
        # test harnesses are bash and legitimately use herestrings. Checking a
        # bash script with `sh -n` reports a syntax error that is not one.
        run: |
          set -euo pipefail
          bash_scripts=$(grep -rl -E '^#!.*\bbash\b' --include='*.sh' feature || true)   # allowed: no match is a valid state
          posix_scripts=$(grep -rL -E '^#!.*\bbash\b' --include='*.sh' feature || true)  # allowed: no match is a valid state
          if [ -n "$bash_scripts" ]; then
            printf '%s\n' "$bash_scripts" | xargs -r -n1 bash -n
          fi
          if [ -n "$posix_scripts" ]; then
            printf '%s\n' "$posix_scripts" | xargs -r -n1 sh -n
          fi
          echo "shell syntax ok"

      - name: feature offline tests
        # A harness lives next to the scripts it tests. If they are not on this
        # ref (a feature branch was not merged yet), skip loudly instead of
        # reporting a wall of failures that are really "missing file".
        run: |
          set -euo pipefail
          found=0
          for t in feature/*/test/run*.sh; do
            [ -f "$t" ] || continue
            dir=$(dirname "$t")
            if [ ! -f "$dir/../target-gen.sh" ] && [ ! -f "$dir/../bootstate.sh" ]; then
              echo "skip $t (feature scripts are not on this ref)"
              continue
            fi
            echo "== $t"
            bash "$t"
            found=$((found + 1))
          done
          echo "test suites run: $found"
