[workspace]
members = [
    "userspace/ksud",
    "userspace/ksuinit",
]
# The trees under third_party/ are independent workspaces with their own Cargo.toml and
# Cargo.lock, built by .github/scripts/build-builtin-modules.sh against the NDK. Without this
# they look like orphaned members of this workspace and `cargo build --manifest-path
# userspace/ksud/Cargo.toml` refuses to run with "current package believes it's in a
# workspace when it's not".
exclude = [
    "third_party",
    "third_party/TEESimulator-RS",
    "third_party/tricky-addon-enhanced",
    "third_party/tricky-addon-enhanced/rust",
    "third_party/tricky-addon-enhanced/external/resetprop-rs",
    "third_party/susfs4ksu-lkm",
]
default-members = [
    "userspace/ksud",
    "userspace/ksuinit",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
log = "0.4"

[patch.crates-io]
libc = { git = "https://github.com/rust-lang/libc", rev = "1a661633f11a261ff9c00b40875ef72f1cbec818" }

[profile.release]
strip = true
lto = true
opt-level = "z"
panic = "abort"

[profile.release.package.ksud]
codegen-units = 1
